[package]
name = "nib"
version = "0.1.0"
description = "Nib 轻量代码编辑器"
authors = ["Nib contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
notify = "8.2.1"
trash = "=5.2.9"
ignore = "0.4.30"
regex = "1.13.1"
# 读取系统字体列表，供设置中的字体选择；WebView 不提供系统字体列表。
fontdb = "=0.24.0"

# macOS 原生窗口标签；与 Tauri 依赖的版本一致，不引入新包。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSGraphics"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
