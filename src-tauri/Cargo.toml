[package]
name = "nib"
version = "0.1.0"
description = "Nib 轻量代码编辑器"
authors = ["Nib contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "nib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
